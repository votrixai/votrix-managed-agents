name: Votrix Managed Agents (VMA) CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra sandbox-e2b

      - name: Validate shell entrypoints
        run: |
          sh -n entrypoint.sh scripts/*.sh scripts/gcloud/*.sh
          bash -n run.sh

      - name: Run tests
        run: uv run pytest

  docs:
    name: Fumadocs static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check documentation
        run: npm run typecheck

      - name: Lint documentation
        run: npm run lint

      - name: Build static documentation
        run: npm run build

      - name: Validate Cloudflare static-assets deployment
        run: npx wrangler deploy --dry-run

  docs-deploy:
    # The documentation site renders the OpenAPI schema committed at
    # `website/public/openapi/vma.json`, so it goes stale the moment the API
    # changes without a matching site deploy. Publishing it from the same
    # branch push that deploys the services keeps the two in step.
    #
    # Requires two repository secrets:
    #   CLOUDFLARE_API_TOKEN  Workers Scripts:Edit, plus Cache Purge on the
    #                         vma.votrixai.com zone for the purge step.
    #   CLOUDFLARE_ZONE_ID    The vma.votrixai.com zone.
    name: Publish documentation site
    needs: [test, docs]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    concurrency:
      # Never let two pushes upload assets to the same environment at once.
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static documentation
        run: npm run build

      - name: Publish staging documentation
        if: github.ref == 'refs/heads/staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging

      - name: Publish production documentation
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Purge the documentation host at the edge
        # Uploading assets does not evict what the edge already cached. Without
        # this, a deployed page can keep serving a build from weeks earlier.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOCS_HOST: >-
            ${{ github.ref == 'refs/heads/main'
              && 'docs.vma.votrixai.com'
              || 'staging-docs.vma.votrixai.com' }}
        run: |
          set -eu
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"hosts\":[\"${DOCS_HOST}\"]}")
          echo "$response"
          # Cloudflare answers 200 with success:false for a rejected purge, so
          # the HTTP status alone is not enough to call this step green.
          echo "$response" | grep -q '"success":true'

  cloudflare-api-router:
    name: Cloudflare API router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/vma-api-router

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/cloudflare/vma-api-router/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check router and deployment configuration
        run: npm run check

      - name: Validate staging deployment bundle
        run: npm run dry-run:staging

      - name: Validate production deployment bundle
        run: npm run dry-run:production
