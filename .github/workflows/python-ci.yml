name: Votrix Managed Agents (VMA) CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra sandbox-e2b

      - name: Validate shell entrypoints
        run: |
          sh -n entrypoint.sh scripts/*.sh scripts/gcloud/*.sh
          bash -n run.sh

      - name: Run tests
        run: uv run pytest

  docs:
    name: Fumadocs static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check documentation
        run: npm run typecheck

      - name: Lint documentation
        run: npm run lint

      - name: Build static documentation
        run: npm run build

      - name: Validate Cloudflare static-assets deployment
        run: npx wrangler deploy --dry-run

  cloudflare-api-router:
    name: Cloudflare API router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/vma-api-router

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/cloudflare/vma-api-router/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check router and deployment configuration
        run: npm run check

      - name: Validate staging deployment bundle
        run: npm run dry-run:staging

      - name: Validate production deployment bundle
        run: npm run dry-run:production
