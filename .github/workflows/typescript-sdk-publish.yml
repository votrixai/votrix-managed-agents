name: Publish Votrix Managed Agents (VMA) TypeScript SDK

on:
  push:
    tags:
      - "sdk-typescript-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and pack SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Use the package npm version
        run: npm install --global npm@11.11.0

      - name: Verify tag matches package version
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          lock_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8')).packages[''].version")"
          expected_tag="sdk-typescript-v${package_version}"
          if [ "$package_version" != "$lock_version" ]; then
            echo "package.json version $package_version does not match package-lock.json $lock_version" >&2
            exit 1
          fi
          if [ "$SDK_TAG" != "$expected_tag" ]; then
            echo "Tag $SDK_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check the SDK
        run: npm run typecheck

      - name: Run SDK tests
        run: npm test

      - name: Build ESM, CommonJS, and declarations
        run: npm run build

      - name: Validate package exports
        run: npm run publint

      - name: Validate published TypeScript types
        run: npm run attw

      - name: Pack the release artifact
        run: |
          mkdir -p pack
          npm pack --pack-destination pack

      - name: Smoke-test packed ESM and CommonJS exports
        run: |
          tarball="$(find "$GITHUB_WORKSPACE/sdks/typescript/pack" -name '*.tgz' -print -quit)"
          test -n "$tarball"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$tarball"

          node --input-type=module <<'NODE'
          import Votrix, { Votrix as NamedVotrix } from "@votrix/managed-agents";

          if (Votrix !== NamedVotrix) throw new Error("ESM default export mismatch");
          const client = new Votrix({ apiKey: "vma_test_smoke", baseURL: "https://example.com" });
          if (!client.files || !client.skills || !client.modelProviders) {
            throw new Error("Missing ESM resources");
          }
          client.close();
          NODE

          node <<'NODE'
          const sdk = require("@votrix/managed-agents");
          const packageMetadata = require("@votrix/managed-agents/package.json");

          if (sdk.default !== sdk.Votrix) throw new Error("CommonJS default export mismatch");
          if (packageMetadata.name !== "@votrix/managed-agents" || sdk.VERSION !== packageMetadata.version) {
            throw new Error("Packed package metadata or exported version mismatch");
          }
          const client = new sdk.Votrix({
            apiKey: "vma_test_smoke",
            baseURL: "https://example.com",
          });
          if (!client.sessions.events || !client.vaults.modelCredentials) {
            throw new Error("Missing nested CommonJS resources");
          }
          client.close();
          NODE

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-package
          path: sdks/typescript/pack/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@votrix/managed-agents
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use an OIDC-capable npm version
        run: npm install --global npm@11.11.0

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: typescript-sdk-package
          path: dist

      - name: Publish with npm Trusted Publishing
        run: npm publish dist/*.tgz --access public
