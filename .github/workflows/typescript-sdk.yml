name: Votrix TypeScript SDK CI

on:
  push:
    paths:
      - "sdks/typescript/**"
      - "docs/typescript-sdk.md"
      - ".github/workflows/typescript-sdk.yml"
      - ".github/workflows/typescript-sdk-publish.yml"
      - "app/models/**"
      - "app/routers/**"
      - "website/public/openapi/vma.json"
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "docs/typescript-sdk.md"
      - ".github/workflows/typescript-sdk.yml"
      - ".github/workflows/typescript-sdk-publish.yml"
      - "app/models/**"
      - "app/routers/**"
      - "website/public/openapi/vma.json"

permissions:
  contents: read

jobs:
  test-build-and-pack:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: sdks/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Use the package npm version
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check the SDK
        run: npm run typecheck

      - name: Run SDK tests
        run: npm test

      - name: Build ESM, CommonJS, and declarations
        run: npm run build

      - name: Validate package exports
        run: npm run publint

      - name: Validate published TypeScript types
        run: npm run attw

      - name: Pack the release artifact
        run: |
          mkdir -p pack
          npm pack --pack-destination pack

      - name: Smoke-test packed ESM and CommonJS exports
        run: |
          tarball="$(find "$GITHUB_WORKSPACE/sdks/typescript/pack" -name '*.tgz' -print -quit)"
          test -n "$tarball"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$tarball"

          node --input-type=module <<'NODE'
          import Votrix, { Votrix as NamedVotrix } from "@votrix/sdk";

          if (Votrix !== NamedVotrix) throw new Error("ESM default export mismatch");
          const client = new Votrix({ apiKey: "vma_smoke", baseURL: "https://example.com" });
          for (const resource of [
            "apiKeys",
            "agents",
            "environments",
            "sessions",
            "files",
            "skills",
            "vaults",
            "modelProviders",
          ]) {
            if (!(resource in client)) throw new Error(`Missing ESM resource: ${resource}`);
          }
          client.close();
          NODE

          node <<'NODE'
          const sdk = require("@votrix/sdk");
          const packageMetadata = require("@votrix/sdk/package.json");

          if (sdk.default !== sdk.Votrix) throw new Error("CommonJS default export mismatch");
          if (packageMetadata.name !== "@votrix/sdk" || sdk.VERSION !== packageMetadata.version) {
            throw new Error("Packed package metadata or exported version mismatch");
          }
          const client = new sdk.Votrix({
            apiKey: "vma_smoke",
            baseURL: "https://example.com",
          });
          if (!client.sessions.events || !client.vaults.modelCredentials) {
            throw new Error("Missing nested CommonJS resources");
          }
          client.close();
          NODE
