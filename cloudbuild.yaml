steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest"
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
        MIGRATION_JOB="${_SERVICE_NAME}-migrate"
        WORKER_SERVICE="${_SERVICE_NAME}-worker"
        WORKER_SERVICE_CONFIG="service.worker.${_APP_ENV}.yaml"
        RUNTIME_SERVICE_ACCOUNT="vma-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
        DATABASE_SECRET="vma-database-url-direct${_SECRET_SUFFIX}"
        DATABASE_SCHEMA="vma"

        echo "Waiting for $$IMAGE to become available..."
        for attempt in $$(seq 1 10); do
          if gcloud artifacts docker images describe "$$IMAGE" \
            --project="${PROJECT_ID}" --quiet >/dev/null 2>&1; then
            break
          fi
          if [ "$$attempt" -eq 10 ]; then
            echo "Image did not become available: $$IMAGE" >&2
            exit 1
          fi
          sleep 10
        done

        echo "Deploying migration job $$MIGRATION_JOB..."
        gcloud run jobs deploy "$$MIGRATION_JOB" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="$$IMAGE" \
          --service-account="$$RUNTIME_SERVICE_ACCOUNT" \
          --set-env-vars="APP_ENV=${_APP_ENV},DATABASE_SCHEMA=$$DATABASE_SCHEMA" \
          --set-secrets="DATABASE_URL=$$DATABASE_SECRET:latest" \
          --command=sh \
          --args=scripts/migrate.sh \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=900s \
          --cpu=1 \
          --memory=512Mi \
          --quiet

        echo "Running migrations before changing the service revision..."
        gcloud run jobs execute "$$MIGRATION_JOB" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --wait \
          --quiet

        WORKER_URL=$$(gcloud run services describe "$$WORKER_SERVICE" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --format='value(status.url)' 2>/dev/null || true)

        if [ -z "$$WORKER_URL" ]; then
          echo "Creating $$WORKER_SERVICE in bootstrap poll mode..."
          sed \
            -e "s|IMAGE_URL|$$IMAGE|" \
            -e "s|__VMA_PUBLIC_BUILD_ID__|${SHORT_SHA}|" \
            -e "s|__VMA_GIT_COMMIT_SHA__|${COMMIT_SHA}|" \
            -e "s|__VMA_TASKS_LOCATION__|${_REGION}|" \
            -e 's|value: "__VMA_WORKER_URL__"|value: ""|' \
            -e 's|value: "cloud"|value: "inline"|' \
            "$$WORKER_SERVICE_CONFIG" | \
            gcloud run services replace \
              --project="${PROJECT_ID}" \
              --region="${_REGION}" \
              /dev/stdin \
              --quiet

          WORKER_URL=$$(gcloud run services describe "$$WORKER_SERVICE" \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            --format='value(status.url)')
        fi

        if [ -z "$$WORKER_URL" ]; then
          echo "Cloud Run did not report a worker service URL." >&2
          exit 1
        fi

        echo "Allowing Cloud Tasks to invoke $$WORKER_SERVICE..."
        gcloud run services add-iam-policy-binding "$$WORKER_SERVICE" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --member="serviceAccount:$$RUNTIME_SERVICE_ACCOUNT" \
          --role="roles/run.invoker" \
          --quiet

        echo "Deploying $$WORKER_SERVICE in hybrid mode..."
        sed \
          -e "s|IMAGE_URL|$$IMAGE|" \
          -e "s|__VMA_PUBLIC_BUILD_ID__|${SHORT_SHA}|" \
          -e "s|__VMA_GIT_COMMIT_SHA__|${COMMIT_SHA}|" \
          -e "s|__VMA_TASKS_LOCATION__|${_REGION}|" \
          -e "s|__VMA_WORKER_URL__|$$WORKER_URL|" \
          "$$WORKER_SERVICE_CONFIG" | \
          gcloud run services replace \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            /dev/stdin \
            --quiet

        echo "Deploying ${_SERVICE_NAME} API service in hybrid mode..."
        sed \
          -e "s|IMAGE_URL|$$IMAGE|" \
          -e "s|__VMA_PUBLIC_BUILD_ID__|${SHORT_SHA}|" \
          -e "s|__VMA_GIT_COMMIT_SHA__|${COMMIT_SHA}|" \
          -e "s|__VMA_TASKS_LOCATION__|${_REGION}|" \
          -e "s|__VMA_WORKER_URL__|$$WORKER_URL|" \
          "${_SERVICE_CONFIG}" | \
          gcloud run services replace \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            /dev/stdin \
            --quiet

substitutions:
  _SERVICE_NAME: votrix-managed-agents
  _SERVICE_CONFIG: service.production.yaml
  _REPO: votrix
  _REGION: us-east4
  _APP_ENV: production
  _SECRET_SUFFIX: ""

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest"
