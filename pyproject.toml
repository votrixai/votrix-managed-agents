[project]
name = "votrix-managed-agents"
version = "0.1.0"
description = "Self-hosted, multi-tenant managed-agents control plane powered by Deep Agents."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",
    "aioboto3>=13.0",
    "cryptography>=42.0",
    "deepagents==0.6.12",
    "langchain-anthropic>=1.4.8,<2.0.0",
    "langchain-openai>=1.3.4,<2.0.0",
    "langchain-deepseek>=1.1.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.0,<1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "langchain-openrouter>=0.2.6,<1.0.0",
]

[project.scripts]
vma-worker = "app.worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
contract = [
    "anthropic==0.116.0",
]
sandbox-e2b = [
    "langchain-e2b==0.0.5",
    "e2b==2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "votrix_managed_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: compatibility tests that require official third-party SDK clients",
]
