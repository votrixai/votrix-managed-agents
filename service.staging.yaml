apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: votrix-managed-agents-staging
  annotations:
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: vma-runtime@votrixai-480422.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: IMAGE_URL
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 4Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/db
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: APP_ENV
              value: "staging"
            - name: DATABASE_SCHEMA
              value: "vma"
            - name: VMA_PUBLIC_BUILD_ID
              value: "__VMA_PUBLIC_BUILD_ID__"
            - name: VMA_GIT_COMMIT_SHA
              value: "__VMA_GIT_COMMIT_SHA__"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: TURN_DISPATCH
              value: "cloud"
            # Activate after the compatibility deployment; see docs/pubsub-worker-pool.md.
            - name: PUBSUB_PROJECT
              value: "votrixai-480422"
            - name: PUBSUB_TOPIC
              value: "vma-turns-staging"
            - name: PUBSUB_SUBSCRIPTION
              value: "vma-turns-worker-staging"
            - name: VMA_WORKER_POOL_ON_DEMAND
              value: "true"
            - name: VMA_WORKER_POOL
              value: "projects/votrixai-480422/locations/__VMA_TASKS_LOCATION__/workerPools/votrix-managed-agents-staging-pool"
            - name: TASKS_PROJECT
              value: "votrixai-480422"
            - name: TASKS_QUEUE
              value: "vma-turns-staging"
            - name: TASKS_LOCATION
              value: "__VMA_TASKS_LOCATION__"
            - name: TASKS_SERVICE_ACCOUNT
              value: "vma-runtime@votrixai-480422.iam.gserviceaccount.com"
            - name: WORKER_URL
              value: "__VMA_WORKER_URL__"
            - name: VMA_DB_POOL_SIZE
              value: "16"
            - name: VMA_DB_MAX_OVERFLOW
              value: "8"
            - name: VMA_DB_POOL_TIMEOUT_SECONDS
              value: "10"
            - name: VMA_DB_POOL_RECYCLE_SECONDS
              value: "300"
            - name: VMA_PUBLIC_GA_ONLY
              value: "true"
            - name: VMA_GOVERNANCE_ENABLED
              value: "true"
            - name: VMA_REQUESTS_PER_MINUTE
              value: "600"
            - name: VMA_MAX_ACTIVE_WORK
              value: "20"
            - name: VMA_DAILY_MODEL_TOKENS
              value: "1000000"
            - name: VMA_ORGANIZATION_STORAGE_BYTES
              value: "5368709120"
            - name: VMA_CORS_ORIGINS
              value: "https://staging-vma.votrixai.com,https://staging-docs.vma.votrixai.com"
            - name: VMA_SANDBOX_PROVIDER
              value: "e2b"
            - name: VMA_E2B_TEMPLATE
              value: "vma-hardened"
            - name: VMA_E2B_WORKDIR
              value: "/workspace"
            - name: VMA_E2B_GUEST_USER
              value: "user"
            - name: SANDBOX_TIMEOUT_SECONDS
              value: "300"
            - name: VMA_E2B_AUTO_RESUME
              value: "false"
            - name: VMA_E2B_KEEP_MEMORY
              value: "true"
            - name: VMA_ALLOW_PLAINTEXT_SECRETS_LOCAL
              value: "false"
            - name: VMA_REQUIRE_BETA_HEADER
              value: "true"
            - name: VMA_REQUIRE_ANTHROPIC_VERSION_HEADER
              value: "true"
            - name: S3_REGION
              value: "auto"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-database-url-staging
            - name: OPENROUTER_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-openrouter-management-key-staging
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-firecrawl-api-key-staging
            - name: VMA_CHECKPOINT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-database-url-direct-staging
            - name: VMA_LISTEN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-listen-database-url-staging
            - name: VMA_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-supabase-url-staging
            - name: VMA_SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-supabase-publishable-key-staging
            - name: VMA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-encryption-key-staging
            - name: E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-e2b-api-key-staging
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-s3-endpoint-url-staging
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-s3-access-key-id-staging
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-s3-secret-access-key-staging
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-s3-bucket-name-staging
