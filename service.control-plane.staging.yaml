apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: votrix-managed-agents-staging-control-plane
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      serviceAccountName: vma-runtime@votrixai-480422.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 120
      containers:
        - image: IMAGE_URL
          command:
            - sh
          args:
            - scripts/start-control-plane.sh
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/db
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: APP_ENV
              value: "staging"
            - name: DATABASE_SCHEMA
              value: "vma"
            - name: VMA_PUBLIC_BUILD_ID
              value: "__VMA_PUBLIC_BUILD_ID__"
            - name: VMA_GIT_COMMIT_SHA
              value: "__VMA_GIT_COMMIT_SHA__"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: VMA_DB_POOL_SIZE
              value: "4"
            - name: VMA_DB_MAX_OVERFLOW
              value: "2"
            - name: VMA_DB_POOL_TIMEOUT_SECONDS
              value: "10"
            - name: VMA_DB_POOL_RECYCLE_SECONDS
              value: "300"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-database-url-staging
            - name: OPENROUTER_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-openrouter-management-key-staging
            - name: VMA_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-supabase-url-staging
            - name: VMA_SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-supabase-publishable-key-staging
            - name: VMA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vma-encryption-key-staging
