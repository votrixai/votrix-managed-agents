[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "votrix-managed-agents"
version = "0.1.0"
description = "Python SDK for Votrix Managed Agents (VMA)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Votrix" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build",
  "pyright>=1.1.400,<2",
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]
# `votrix` is a PEP 420 namespace shared with future Votrix product SDKs, so it
# carries no __init__.py and is discovered as a namespace package.
namespaces = true

[tool.setuptools.package-data]
"votrix.managed_agents" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src/votrix/managed_agents"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
